# ─────────────────────────────────────────────────────────────────────
# DO NOT commit real values here.
# Populate via CI/CD using envsubst, or apply manually:
#
#   kubectl create secret generic geekclash-backend-secrets \
#     --from-literal=DB_URL="..." \
#     --from-literal=SECRET="..." \
#     ... \
#     -n geekclash --dry-run=client -o yaml | kubectl apply -f -
# ─────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: geekclash-backend-secrets
  namespace: geekclash
type: Opaque
stringData:
  DB_URL: "${DB_URL}"
  SECRET: "${SECRET}"
  USER_SECRET: "${USER_SECRET}"
  ADMIN_SECRET: "${ADMIN_SECRET}"
  EMAIL: "${EMAIL}"
  PASSWORD: "${EMAIL_PASSWORD}"
  CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
  CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
  CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"
  RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID}"
  RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET}"
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
  GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
