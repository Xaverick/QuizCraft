apiVersion: apps/v1
kind: Deployment
metadata:
  name: geekclash-backend
  namespace: geekclash
  labels:
    app: geekclash-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: geekclash-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: geekclash-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          # IMAGE_TAG is replaced by sed in CI: DOCKERHUB_USERNAME/geekclash-backend:sha
          image: DOCKERHUB_USERNAME/geekclash-backend:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: geekclash-backend-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: geekclash-backend-secrets
                  key: DB_URL
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: geekclash-backend-secrets
                  key: SECRET
            - name: USER_SECRET
              valueFrom:
                secretKeyRef:
                  name: geekclash-backend-secrets
                  key: USER_SECRET
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: geekclash-backend-secrets
                  key: ADMIN_SECRET
            - name: EMAIL
              valueFrom:
                secretKeyRef:
                  name: geekclash-backend-secrets
                  key: EMAIL
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geekclash-backend-secrets
                  key: PASSWORD
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: geekclash-backend-secrets
                  key: CLOUDINARY_CLOUD_NAME
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: geekclash-backend-secrets
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: geekclash-backend-secrets
                  key: CLOUDINARY_API_SECRET
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: geekclash-backend-secrets
                  key: RAZORPAY_KEY_ID
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: geekclash-backend-secrets
                  key: RAZORPAY_KEY_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: geekclash-backend-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: geekclash-backend-secrets
                  key: GOOGLE_CLIENT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: temp-uploads
              mountPath: /app/public/temp
      volumes:
        - name: temp-uploads
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: geekclash-backend-svc
  namespace: geekclash
  labels:
    app: geekclash-backend
spec:
  type: ClusterIP
  selector:
    app: geekclash-backend
  ports:
    - name: http
      port: 80
      targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: geekclash-backend-hpa
  namespace: geekclash
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: geekclash-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
