apiVersion: apps/v1
kind: Deployment
metadata:
  name: geekclash-admin
  namespace: geekclash
  labels:
    app: geekclash-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geekclash-admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: geekclash-admin
    spec:
      containers:
        - name: admin
          image: DOCKERHUB_USERNAME/geekclash-admin:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      terminationGracePeriodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: geekclash-admin-svc
  namespace: geekclash
  labels:
    app: geekclash-admin
spec:
  type: ClusterIP
  selector:
    app: geekclash-admin
  ports:
    - name: http
      port: 80
      targetPort: 80
