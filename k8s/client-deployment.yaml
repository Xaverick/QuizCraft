apiVersion: apps/v1
kind: Deployment
metadata:
  name: geekclash-client
  namespace: geekclash
  labels:
    app: geekclash-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: geekclash-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: geekclash-client
    spec:
      containers:
        - name: client
          image: DOCKERHUB_USERNAME/geekclash-client:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      terminationGracePeriodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: geekclash-client-svc
  namespace: geekclash
  labels:
    app: geekclash-client
spec:
  type: ClusterIP
  selector:
    app: geekclash-client
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: geekclash-client-hpa
  namespace: geekclash
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: geekclash-client
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
