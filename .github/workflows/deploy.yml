name: Build → Push → Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/geekclash-backend
  CLIENT_IMAGE:  ${{ secrets.DOCKERHUB_USERNAME }}/geekclash-client
  ADMIN_IMAGE:   ${{ secrets.DOCKERHUB_USERNAME }}/geekclash-admin

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Validate K8s manifests (dry-run)
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/configmap.yaml

  # ──────────────────────────────────────────────
  # Job 2: Build & push all three images
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.tag.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag (short SHA)
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Backend ──
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          platforms: linux/amd64,linux/arm64

      # ── Client (user-facing) ──
      - name: Build & push client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.CLIENT_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.CLIENT_IMAGE }}:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max
          platforms: linux/amd64,linux/arm64

      # ── Admin ──
      - name: Build & push admin
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          tags: |
            ${{ env.ADMIN_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.ADMIN_IMAGE }}:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
          platforms: linux/amd64,linux/arm64

  # ──────────────────────────────────────────────
  # Job 3: Deploy to Kubernetes (kubectl apply)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify cluster connection
        run: kubectl cluster-info

      # Apply namespace + config (idempotent)
      - name: Apply namespace and config
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml

      # Inject secrets via envsubst (values come from GitHub secrets, never from repo)
      - name: Apply secrets
        env:
          DB_URL: ${{ secrets.DB_URL }}
          SECRET: ${{ secrets.SECRET }}
          USER_SECRET: ${{ secrets.USER_SECRET }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          EMAIL: ${{ secrets.EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          envsubst < k8s/secrets.yaml | kubectl apply -f -

      # Stamp the exact image tag into manifests, then apply
      - name: Apply deployments with new image tags
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for f in k8s/backend-deployment.yaml k8s/client-deployment.yaml k8s/admin-deployment.yaml; do
            sed "s|DOCKERHUB_USERNAME|${DOCKERHUB_USERNAME}|g; s|IMAGE_TAG|${IMAGE_TAG}|g" "$f" \
              | kubectl apply -f -
          done

      - name: Apply ingress
        run: kubectl apply -f k8s/ingress.yaml

      # Wait for rollouts
      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/geekclash-backend -n geekclash --timeout=3m
          kubectl rollout status deployment/geekclash-client  -n geekclash --timeout=3m
          kubectl rollout status deployment/geekclash-admin   -n geekclash --timeout=3m

      - name: Post-deploy pod status
        if: always()
        run: kubectl get pods -n geekclash -o wide
